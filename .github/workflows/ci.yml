name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore BillFlow.sln

      - name: Build
        run: dotnet build BillFlow.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test BillFlow.sln --no-build --configuration Release --verbosity normal

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f src/BillFlow.Api/Dockerfile -t billflow-api:ci .

      - name: Build Web image
        run: docker build -f src/BillFlow.Web/Dockerfile -t billflow-web:ci .
